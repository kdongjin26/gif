<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이미지 → GIF 변환기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: #1e1e1e; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: #252526; border-bottom: 1px solid #333;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  button, select, input[type="number"] {
    background: #2d2d30; color: #e5e5e5; border: 1px solid #454545;
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { background: #3e3e42; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #0e639c; border-color: #0e639c; }
  button.primary:hover:not(:disabled) { background: #1177bb; }
  input[type="number"] { width: 80px; }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; overflow: hidden; }
  #list-panel {
    width: 340px; border-right: 1px solid #333; display: flex; flex-direction: column; background: #252526;
  }
  #list-header {
    padding: 8px 12px; font-size: 12px; color: #9cdcfe; border-bottom: 1px solid #333;
    display: flex; justify-content: space-between; align-items: center;
  }
  #frame-list { flex: 1; overflow-y: auto; padding: 6px; }
  #frame-list.empty { display: flex; align-items: center; justify-content: center; color: #888; text-align: center; padding: 20px; }
  .frame {
    display: flex; align-items: center; gap: 8px; padding: 6px; margin-bottom: 4px;
    background: #2d2d30; border: 1px solid #3e3e42; border-radius: 4px; cursor: move;
    transition: background 0.1s;
  }
  .frame.selected { border-color: #0e639c; background: #094771; }
  .frame.dragging { opacity: 0.4; }
  .frame.drag-over { border-top: 2px solid #0e639c; }
  .frame img { width: 48px; height: 48px; object-fit: contain; background: #1e1e1e; border-radius: 2px; flex-shrink: 0; }
  .frame-info { flex: 1; min-width: 0; }
  .frame-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame-meta { font-size: 11px; color: #888; }
  .frame-duration { width: 70px; }
  .frame-actions { display: flex; flex-direction: column; gap: 2px; }
  .frame-actions button { padding: 2px 6px; font-size: 11px; }
  #preview-panel { flex: 1; display: flex; flex-direction: column; }
  #preview-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#2a2a2a 0% 25%, #1e1e1e 0% 50%) 50% / 20px 20px;
    overflow: hidden; position: relative;
  }
  #preview-canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  #drop-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 15px; pointer-events: none; flex-direction: column; gap: 8px;
  }
  #drop-hint.hidden { display: none; }
  body.dragover #drop-hint { color: #9cdcfe; }
  body.dragover #preview-wrap { outline: 2px dashed #0e639c; outline-offset: -10px; }
  #settings-panel {
    padding: 10px 16px; background: #252526; border-top: 1px solid #333;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  #settings-panel label { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #status { padding: 6px 16px; font-size: 12px; color: #888; background: #007acc; color: white; }
  #status.idle { background: #252526; color: #888; }
  #status.error { background: #a1260d; color: white; }
  .progress { display: inline-block; margin-left: 10px; }
  .sep { width: 1px; height: 20px; background: #454545; }
</style>
</head>
<body>
<header>
  <h1>이미지 → 애니메이션 이미지 변환기</h1>
  <button id="btn-load">이미지 불러오기</button>
  <button id="btn-clear">전체 삭제</button>
  <div class="sep"></div>
  <label>정렬:
    <select id="sort-mode">
      <option value="name-asc">파일명 ↑</option>
      <option value="name-desc">파일명 ↓</option>
      <option value="date-asc">수정일 ↑</option>
      <option value="date-desc">수정일 ↓</option>
    </select>
  </label>
  <button id="btn-sort">정렬 적용</button>
  <div class="spacer"></div>
  <button id="btn-preview">▶ 미리보기</button>
  <button id="btn-stop">■ 정지</button>
  <div class="sep"></div>
  <button id="btn-save" class="primary">저장 (기본)</button>
  <button id="btn-saveas">다른 이름으로 저장</button>
</header>

<main>
  <div id="list-panel">
    <div id="list-header">
      <span id="frame-count">프레임 0개</span>
      <span style="color:#888;">드래그로 순서 변경</span>
    </div>
    <div id="frame-list" class="empty">
      이미지를 추가하세요
    </div>
  </div>

  <div id="preview-panel">
    <div id="preview-wrap">
      <canvas id="preview-canvas" width="400" height="300"></canvas>
      <div id="drop-hint">
        <div style="font-size: 32px;">📁</div>
        <div>파일을 이곳에 드래그하거나<br>상단 "이미지 불러오기" 버튼을 누르세요</div>
        <div style="font-size: 11px; color:#666;">지원: PNG, JPG, JPEG, BMP, WebP, GIF</div>
      </div>
    </div>
    <div id="settings-panel">
      <label>전체 프레임 시간:
        <input type="number" id="global-duration" value="100" min="10" step="10">ms
      </label>
      <button id="btn-apply-duration">일괄 적용</button>
      <div class="sep"></div>
      <label>반복:
        <select id="loop-mode">
          <option value="0" selected>무한</option>
          <option value="1">1회</option>
          <option value="2">2회</option>
          <option value="3">3회</option>
          <option value="5">5회</option>
          <option value="10">10회</option>
          <option value="custom">직접 입력</option>
        </select>
      </label>
      <input type="number" id="loop-custom" value="1" min="1" style="display:none;">
      <div class="sep"></div>
      <label>크기 처리:
        <select id="size-mode">
          <option value="max">최대 크기 맞춤 (여백)</option>
          <option value="first">첫 프레임 크기</option>
        </select>
      </label>
      <div class="sep"></div>
      <label>배경색:
        <input type="color" id="bg-color" value="#000000">
      </label>
      <label><input type="checkbox" id="bg-transparent"> 투명</label>
      <div class="sep"></div>
      <label>출력 포맷:
        <select id="format">
          <option value="apng" selected>APNG (.png, 무손실 풀컬러)</option>
          <option value="webp">WebP (.webp, 고품질 + 작은 용량)</option>
        </select>
      </label>
    </div>
  </div>
</main>

<div id="status" class="idle">준비됨</div>

<input type="file" id="file-input" accept="image/png,image/jpeg,image/jpg,image/bmp,image/webp,image/gif" multiple style="display:none;">

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const frames = []; // { id, name, lastModified, img, width, height, duration }
let nextId = 1;
let selectedId = null;
let playTimer = null;

const statusEl = $('status');
function setStatus(msg, type = 'idle') {
  statusEl.textContent = msg;
  statusEl.className = type;
}

function acceptedFile(f) {
  return /^image\/(png|jpe?g|bmp|webp|gif)$/i.test(f.type) ||
         /\.(png|jpe?g|bmp|webp|gif)$/i.test(f.name);
}

async function addFiles(fileList) {
  const files = Array.from(fileList).filter(acceptedFile);
  if (!files.length) { setStatus('지원하는 이미지가 없습니다', 'error'); return; }
  const defaultDuration = Number($('global-duration').value) || 100;
  setStatus(`${files.length}개 파일 로딩 중...`);
  for (const file of files) {
    try {
      const img = await loadImage(file);
      frames.push({
        id: nextId++,
        name: file.name,
        lastModified: file.lastModified || Date.now(),
        img,
        width: img.naturalWidth,
        height: img.naturalHeight,
        duration: defaultDuration,
      });
    } catch (e) {
      console.error('로딩 실패:', file.name, e);
    }
  }
  renderList();
  drawPreviewFrame(frames.length - 1);
  setStatus(`프레임 ${frames.length}개`);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function renderList() {
  const list = $('frame-list');
  $('frame-count').textContent = `프레임 ${frames.length}개`;
  if (!frames.length) {
    list.className = 'empty';
    list.innerHTML = '이미지를 추가하세요';
    return;
  }
  list.className = '';
  list.innerHTML = '';
  frames.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'frame' + (f.id === selectedId ? ' selected' : '');
    row.draggable = true;
    row.dataset.id = f.id;
    row.innerHTML = `
      <img src="${f.img.src}" alt="">
      <div class="frame-info">
        <div class="frame-name" title="${f.name}">${i + 1}. ${f.name}</div>
        <div class="frame-meta">${f.width}×${f.height}</div>
      </div>
      <input type="number" class="frame-duration" value="${f.duration}" min="10" step="10" title="지연(ms)">
      <div class="frame-actions">
        <button data-act="replace" title="교체">⟳</button>
        <button data-act="delete" title="삭제">✕</button>
      </div>
    `;
    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
      selectedId = f.id;
      renderList();
      drawPreviewFrame(i);
    });
    row.querySelector('.frame-duration').addEventListener('change', (e) => {
      f.duration = Math.max(10, Number(e.target.value) || 100);
    });
    row.querySelector('[data-act="delete"]').addEventListener('click', () => {
      frames.splice(i, 1);
      if (selectedId === f.id) selectedId = null;
      renderList();
      if (frames.length) drawPreviewFrame(Math.min(i, frames.length - 1));
      else clearPreview();
    });
    row.querySelector('[data-act="replace"]').addEventListener('click', () => replaceFrame(i));
    // drag to reorder
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/frame-id', String(f.id));
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes('text/frame-id')) {
        e.preventDefault();
        row.classList.add('drag-over');
      }
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      row.classList.remove('drag-over');
      const id = Number(e.dataTransfer.getData('text/frame-id'));
      if (!id || id === f.id) return;
      e.preventDefault();
      const from = frames.findIndex(x => x.id === id);
      const to = frames.findIndex(x => x.id === f.id);
      if (from < 0 || to < 0) return;
      const [moved] = frames.splice(from, 1);
      frames.splice(to, 0, moved);
      renderList();
    });
    list.appendChild(row);
  });
}

function replaceFrame(index) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    if (!input.files[0]) return;
    const img = await loadImage(input.files[0]);
    const f = frames[index];
    f.img = img;
    f.name = input.files[0].name;
    f.width = img.naturalWidth;
    f.height = img.naturalHeight;
    f.lastModified = input.files[0].lastModified;
    renderList();
    drawPreviewFrame(index);
  };
  input.click();
}

function getCanvasSize() {
  if (!frames.length) return { w: 400, h: 300 };
  if ($('size-mode').value === 'first') {
    return { w: frames[0].width, h: frames[0].height };
  }
  let w = 0, h = 0;
  for (const f of frames) { if (f.width > w) w = f.width; if (f.height > h) h = f.height; }
  return { w, h };
}

function drawFrameTo(ctx, frame, w, h) {
  const transparent = $('bg-transparent').checked;
  if (!transparent) {
    ctx.fillStyle = $('bg-color').value;
    ctx.fillRect(0, 0, w, h);
  } else {
    ctx.clearRect(0, 0, w, h);
  }
  const x = Math.floor((w - frame.width) / 2);
  const y = Math.floor((h - frame.height) / 2);
  ctx.drawImage(frame.img, x, y);
}

function drawPreviewFrame(index) {
  if (!frames.length) { clearPreview(); return; }
  const idx = Math.max(0, Math.min(index, frames.length - 1));
  const { w, h } = getCanvasSize();
  const canvas = $('preview-canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawFrameTo(ctx, frames[idx], w, h);
  $('drop-hint').classList.add('hidden');
}

function clearPreview() {
  const canvas = $('preview-canvas');
  canvas.width = 400; canvas.height = 300;
  canvas.getContext('2d').clearRect(0, 0, 400, 300);
  $('drop-hint').classList.remove('hidden');
}

function startPreview() {
  if (!frames.length) return;
  stopPreview();
  let i = 0;
  const tick = () => {
    drawPreviewFrame(i);
    const d = frames[i].duration;
    i = (i + 1) % frames.length;
    playTimer = setTimeout(tick, d);
  };
  tick();
  setStatus('미리보기 재생 중');
}

function stopPreview() {
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  setStatus('준비됨');
}

function currentFormat() { return $('format').value; }
function formatExt(fmt) { return fmt === 'webp' ? '.webp' : '.png'; }
function formatSuffix(fmt) { return fmt === 'webp' ? '_webp' : '_apng'; }

// default save name: <last_original_name_without_ext><suffix><ext>
function defaultSaveName() {
  const fmt = currentFormat();
  if (!frames.length) return `output${formatExt(fmt)}`;
  const last = frames[frames.length - 1].name;
  const base = last.replace(/\.[^.]+$/, '');
  return `${base}${formatSuffix(fmt)}${formatExt(fmt)}`;
}

function getLoopCount() {
  const mode = $('loop-mode').value;
  if (mode === 'custom') return Math.max(1, Number($('loop-custom').value) || 1);
  return Number(mode); // 0 = infinite
}

// CRC32 for PNG chunk
function crc32(bytes, start, end) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < end; i++) {
    c ^= bytes[i];
    for (let j = 0; j < 8; j++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Patch APNG acTL chunk num_plays (0 = infinite)
function patchApngLoop(buffer, numPlays) {
  const bytes = new Uint8Array(buffer);
  for (let i = 8; i < bytes.length - 12; i++) {
    if (bytes[i] === 0x61 && bytes[i+1] === 0x63 && bytes[i+2] === 0x54 && bytes[i+3] === 0x4C) {
      // type 'acTL' at i..i+3; data at i+4..i+11 (num_frames, num_plays); CRC at i+12..i+15
      const dv = new DataView(bytes.buffer, bytes.byteOffset + i + 8, 4);
      dv.setUint32(0, numPlays >>> 0, false);
      const crc = crc32(bytes, i, i + 12);
      const dv2 = new DataView(bytes.buffer, bytes.byteOffset + i + 12, 4);
      dv2.setUint32(0, crc, false);
      return bytes;
    }
  }
  return bytes;
}

async function buildApng() {
  if (!frames.length) { setStatus('프레임이 없습니다', 'error'); return null; }
  const { w, h } = getCanvasSize();
  setStatus('APNG 생성 중...');
  await new Promise(r => setTimeout(r, 0)); // allow UI update
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d');
  const buffers = [];
  const delays = [];
  for (const f of frames) {
    drawFrameTo(tctx, f, w, h);
    const data = tctx.getImageData(0, 0, w, h).data;
    buffers.push(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
    delays.push(f.duration);
  }
  // cnum=0 → lossless full 24-bit RGBA
  const apngBuffer = UPNG.encode(buffers, w, h, 0, delays);
  const loop = getLoopCount(); // 0 = infinite
  const patched = patchApngLoop(apngBuffer, loop);
  setStatus('완료');
  return new Blob([patched], { type: 'image/png' });
}

// --- Animated WebP via RIFF container assembly ---
// Each frame is encoded by canvas.toBlob('image/webp', 1.0), then VP8/VP8L/ALPH
// chunks are extracted and wrapped in an animated WebP (VP8X + ANIM + ANMF).

function parseWebPChunks(bytes) {
  if (bytes.length < 12) return [];
  const chunks = [];
  let off = 12; // skip RIFF + size + WEBP
  while (off + 8 <= bytes.length) {
    const type = String.fromCharCode(bytes[off], bytes[off+1], bytes[off+2], bytes[off+3]);
    const size = new DataView(bytes.buffer, bytes.byteOffset + off + 4, 4).getUint32(0, true);
    const dataStart = off + 8;
    const dataEnd = dataStart + size;
    if (dataEnd > bytes.length) break;
    chunks.push({ type, data: bytes.slice(dataStart, dataEnd) });
    off = dataEnd + (size & 1);
  }
  return chunks;
}

function writeU24LE(arr, off, v) {
  arr[off] = v & 0xFF; arr[off+1] = (v >> 8) & 0xFF; arr[off+2] = (v >> 16) & 0xFF;
}

async function buildWebP() {
  if (!frames.length) { setStatus('프레임이 없습니다', 'error'); return null; }
  const { w, h } = getCanvasSize();
  if (w > 16384 || h > 16384) { setStatus('WebP 최대 크기 16384 초과', 'error'); return null; }
  const loop = getLoopCount(); // 0 = infinite
  const transparent = $('bg-transparent').checked;

  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d');

  const frameBodies = [];
  let hasAlpha = false;
  for (let i = 0; i < frames.length; i++) {
    setStatus(`WebP 프레임 인코딩 ${i + 1}/${frames.length}...`);
    await new Promise(r => setTimeout(r, 0));
    drawFrameTo(tctx, frames[i], w, h);
    const blob = await new Promise((res, rej) => {
      tmp.toBlob(b => b ? res(b) : rej(new Error('toBlob 실패 (브라우저 WebP 미지원?)')), 'image/webp', 1.0);
    });
    const buf = new Uint8Array(await blob.arrayBuffer());
    const imgChunks = parseWebPChunks(buf).filter(c => ['VP8 ', 'VP8L', 'ALPH'].includes(c.type));
    if (!imgChunks.length) throw new Error('WebP 이미지 청크 추출 실패');
    if (imgChunks.some(c => c.type === 'VP8L' || c.type === 'ALPH')) hasAlpha = hasAlpha || transparent;
    // reassemble image chunks with headers, padded to even
    const parts = [];
    for (const c of imgChunks) {
      const head = new Uint8Array(8);
      for (let k = 0; k < 4; k++) head[k] = c.type.charCodeAt(k);
      new DataView(head.buffer).setUint32(4, c.data.length, true);
      parts.push(head, c.data);
      if (c.data.length & 1) parts.push(new Uint8Array(1));
    }
    let total = 0; for (const p of parts) total += p.length;
    const body = new Uint8Array(total);
    { let o = 0; for (const p of parts) { body.set(p, o); o += p.length; } }
    frameBodies.push({ bytes: body, duration: frames[i].duration });
  }

  setStatus('WebP 컨테이너 조립 중...');
  const wm1 = w - 1, hm1 = h - 1;
  const parts = [];
  // VP8X
  const vp8x = new Uint8Array(8 + 10);
  vp8x.set([0x56,0x50,0x38,0x58], 0);
  new DataView(vp8x.buffer).setUint32(4, 10, true);
  vp8x[8] = 0x02 | (transparent ? 0x10 : 0); // ANIMATION + optional ALPHA
  writeU24LE(vp8x, 12, wm1);
  writeU24LE(vp8x, 15, hm1);
  parts.push(vp8x);

  // ANIM
  const anim = new Uint8Array(8 + 6);
  anim.set([0x41,0x4E,0x49,0x4D], 0);
  new DataView(anim.buffer).setUint32(4, 6, true);
  // background BGRA zeros (transparent) — irrelevant when frames cover canvas
  anim[12] = loop & 0xFF; anim[13] = (loop >> 8) & 0xFF;
  parts.push(anim);

  // ANMF per frame
  for (const fb of frameBodies) {
    const dataLen = 16 + fb.bytes.length;
    const anmf = new Uint8Array(8 + 16);
    anmf.set([0x41,0x4E,0x4D,0x46], 0);
    new DataView(anmf.buffer).setUint32(4, dataLen, true);
    // x=0, y=0 (3 bytes each, already zero)
    writeU24LE(anmf, 14, wm1);
    writeU24LE(anmf, 17, hm1);
    writeU24LE(anmf, 20, Math.min(fb.duration, 0xFFFFFF));
    anmf[23] = 0; // alpha_blend + no dispose
    parts.push(anmf, fb.bytes);
    if (fb.bytes.length & 1) parts.push(new Uint8Array(1));
  }

  let bodyLen = 4; // 'WEBP'
  for (const p of parts) bodyLen += p.length;
  const out = new Uint8Array(8 + bodyLen);
  out.set([0x52,0x49,0x46,0x46], 0); // RIFF
  new DataView(out.buffer).setUint32(4, bodyLen, true);
  out.set([0x57,0x45,0x42,0x50], 8); // WEBP
  let off = 12;
  for (const p of parts) { out.set(p, off); off += p.length; }

  setStatus('완료');
  return new Blob([out], { type: 'image/webp' });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function buildByFormat() {
  return currentFormat() === 'webp' ? buildWebP() : buildApng();
}

async function saveDefault() {
  const blob = await buildByFormat();
  if (blob) downloadBlob(blob, defaultSaveName());
}

async function saveAs() {
  if (!frames.length) { setStatus('프레임이 없습니다', 'error'); return; }
  const fmt = currentFormat();
  const ext = formatExt(fmt);
  const defName = defaultSaveName().replace(new RegExp(`\\${ext}$`), '');
  const name = prompt(`파일명 입력 (${ext} 확장자 자동 추가)`, defName);
  if (name === null) return;
  const finalName = name.toLowerCase().endsWith(ext) ? name : `${name}${ext}`;
  const blob = await buildByFormat();
  if (blob) downloadBlob(blob, finalName);
}

function applySort() {
  const mode = $('sort-mode').value;
  frames.sort((a, b) => {
    if (mode.startsWith('name')) {
      const r = a.name.localeCompare(b.name, 'ko', { numeric: true, sensitivity: 'base' });
      return mode.endsWith('asc') ? r : -r;
    } else {
      const r = a.lastModified - b.lastModified;
      return mode.endsWith('asc') ? r : -r;
    }
  });
  renderList();
}

// Wiring
$('btn-load').onclick = () => $('file-input').click();
$('file-input').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('btn-clear').onclick = () => {
  if (!frames.length) return;
  if (!confirm('모든 프레임을 삭제할까요?')) return;
  frames.length = 0; selectedId = null; renderList(); clearPreview(); setStatus('준비됨');
};
$('btn-sort').onclick = applySort;
$('btn-preview').onclick = startPreview;
$('btn-stop').onclick = stopPreview;
$('btn-save').onclick = saveDefault;
$('btn-saveas').onclick = saveAs;
$('btn-apply-duration').onclick = () => {
  const d = Math.max(10, Number($('global-duration').value) || 100);
  frames.forEach(f => f.duration = d);
  renderList();
};
$('loop-mode').onchange = (e) => {
  $('loop-custom').style.display = e.target.value === 'custom' ? 'inline-block' : 'none';
};
$('size-mode').onchange = () => { if (frames.length) drawPreviewFrame(0); };
$('bg-color').onchange = () => { if (frames.length) drawPreviewFrame(0); };
$('bg-transparent').onchange = () => { if (frames.length) drawPreviewFrame(0); };

// Drag & drop to window
['dragenter', 'dragover'].forEach(ev => {
  document.body.addEventListener(ev, (e) => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      document.body.classList.add('dragover');
    }
  });
});
['dragleave', 'drop'].forEach(ev => {
  document.body.addEventListener(ev, (e) => {
    if (e.type === 'dragleave' && e.target !== document.body) return;
    document.body.classList.remove('dragover');
  });
});
document.body.addEventListener('drop', (e) => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  addFiles(e.dataTransfer.files);
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); $('btn-load').click(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveDefault(); }
  else if (e.key === 'Delete' && selectedId !== null) {
    const i = frames.findIndex(f => f.id === selectedId);
    if (i >= 0) {
      frames.splice(i, 1);
      selectedId = null;
      renderList();
      if (frames.length) drawPreviewFrame(Math.min(i, frames.length - 1));
      else clearPreview();
    }
  } else if (e.key === ' ') { e.preventDefault(); playTimer ? stopPreview() : startPreview(); }
});

setStatus('준비됨');
</script>
</body>
