<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이미지 도구</title>
<style>
  body {
    margin: 0; height: 100vh;
    display: flex; flex-direction: column;
    background: #1e1e1e; color: #e5e5e5;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
    overflow: hidden;
  }
  nav {
    display: flex; gap: 4px; padding: 6px 10px;
    background: #1a1a1a; border-bottom: 1px solid #333;
    align-items: center; flex-shrink: 0;
  }
  nav h1 { font-size: 14px; margin: 0 12px 0 4px; font-weight: 600; }
  nav button {
    background: #2d2d30; color: #ccc; border: 1px solid #454545;
    padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  nav button:hover { background: #3e3e42; }
  nav button.active { background: #0e639c; border-color: #0e639c; color: white; }
  .frames { flex: 1; position: relative; min-height: 0; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: none;
    background: #1e1e1e;
  }
  body.mode-crop iframe[data-mode="crop"] { display: block; }
  body.mode-anim iframe[data-mode="anim"] { display: block; }
</style>
</head>
<body class="mode-crop">
  <nav>
    <h1>이미지 도구</h1>
    <button data-mode="crop" class="active">✂️ 자르기</button>
    <button data-mode="anim">🎞 합치기</button>
  </nav>
  <div class="frames">
    <iframe data-mode="crop" src="crop.html"></iframe>
    <iframe data-mode="anim" src="anim.html"></iframe>
  </div>
  <script>
    document.querySelectorAll('nav button').forEach(btn => {
      btn.onclick = () => {
        const mode = btn.dataset.mode;
        document.body.className = 'mode-' + mode;
        document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
      };
    });
  </script>
</body>
</html>
