<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이미지 자르기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: #1e1e1e; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 10px 16px; background: #252526; border-bottom: 1px solid #333;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  button {
    background: #2d2d30; color: #e5e5e5; border: 1px solid #454545;
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { background: #3e3e42; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #0e639c; border-color: #0e639c; }
  button.primary:hover:not(:disabled) { background: #1177bb; }
  .spacer { flex: 1; }
  .sep { width: 1px; height: 20px; background: #454545; }
  main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  #list-panel {
    width: 220px; border-right: 1px solid #333; display: flex; flex-direction: column; background: #252526;
  }
  #list-header {
    padding: 8px 12px; font-size: 12px; color: #9cdcfe; border-bottom: 1px solid #333;
  }
  #image-list { flex: 1; overflow-y: auto; padding: 6px; }
  #image-list.empty { display: flex; align-items: center; justify-content: center; color: #888; text-align: center; padding: 20px; font-size: 12px; }
  .item {
    display: flex; align-items: center; gap: 6px; padding: 6px; margin-bottom: 4px;
    background: #2d2d30; border: 1px solid #3e3e42; border-radius: 4px; cursor: pointer;
  }
  .item:hover { background: #333337; }
  .item.selected { border-color: #0e639c; background: #094771; }
  .item img { width: 40px; height: 40px; object-fit: contain; background: #1e1e1e; border-radius: 2px; flex-shrink: 0; }
  .item-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .item-del { padding: 2px 6px; font-size: 11px; }
  #canvas-wrap {
    flex: 1; position: relative; background: repeating-conic-gradient(#2a2a2a 0% 25%, #1e1e1e 0% 50%) 50% / 20px 20px;
    overflow: hidden;
  }
  #view { position: absolute; top: 0; left: 0; cursor: default; }
  #drop-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 15px; pointer-events: none; flex-direction: column; gap: 8px;
  }
  #drop-hint.hidden { display: none; }
  body.dragover #drop-hint { color: #9cdcfe; }
  body.dragover #canvas-wrap { outline: 2px dashed #0e639c; outline-offset: -10px; }
  #status { padding: 6px 16px; font-size: 12px; background: #252526; color: #888; border-top: 1px solid #333; }
  #status.busy { background: #007acc; color: white; }
  #status.error { background: #a1260d; color: white; }
</style>
</head>
<body>
<header>
  <h1>이미지 자르기</h1>
  <button id="btn-load">이미지 불러오기</button>
  <div class="sep"></div>
  <button id="btn-rotate-ccw" title="반시계 90°">↺ 90°</button>
  <button id="btn-rotate-cw" title="시계 90°">↻ 90°</button>
  <button id="btn-flip-h" title="좌우 반전">⇔</button>
  <button id="btn-flip-v" title="상하 반전">⇕</button>
  <div class="sep"></div>
  <button id="btn-zoom-out" title="축소">🔍−</button>
  <button id="btn-zoom-in" title="확대">🔍+</button>
  <button id="btn-fit" title="화면에 맞추기">맞춤</button>
  <span id="zoom-label" style="font-size:12px;color:#888;min-width:48px;text-align:center;">100%</span>
  <div class="sep"></div>
  <button id="btn-select-all">전체 선택</button>
  <div class="spacer"></div>
  <button id="btn-save" class="primary">잘라서 저장</button>
</header>

<main>
  <aside id="list-panel">
    <div id="list-header"><span id="image-count">이미지 0장</span></div>
    <div id="image-list" class="empty">이미지를 추가하세요</div>
  </aside>
  <div id="canvas-wrap">
    <canvas id="view"></canvas>
    <div id="drop-hint">
      <div style="font-size: 32px;">✂️</div>
      <div>파일을 이곳에 드래그하거나<br>"이미지 불러오기" 버튼을 누르세요</div>
      <div style="font-size: 11px; color:#666;">여러 장 한번에 가능 · PNG로 저장</div>
    </div>
  </div>
</main>

<div id="status">준비됨</div>

<input type="file" id="file-input" accept="image/*" multiple style="display:none;">

<script>
const $ = (id) => document.getElementById(id);
const canvas = $('view');
const ctx = canvas.getContext('2d');
const wrap = $('canvas-wrap');

const images = []; // { id, name, img, source, rotation, flipH, flipV, sel: {x,y,w,h} }
let nextId = 1;
let currentIdx = -1;
let zoom = 1, panX = 0, panY = 0;
let interact = null;

const HANDLE_SIZE = 10;
const MIN_SEL = 4;

function setStatus(msg, type = '') {
  const s = $('status');
  s.textContent = msg;
  s.className = type;
}

function current() { return currentIdx >= 0 ? images[currentIdx] : null; }

function acceptedFile(f) { return /^image\//i.test(f.type) || /\.(png|jpe?g|bmp|webp|gif)$/i.test(f.name); }

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function addFiles(fileList) {
  const files = Array.from(fileList).filter(acceptedFile);
  if (!files.length) { setStatus('지원하는 이미지가 없습니다', 'error'); return; }
  setStatus(`${files.length}개 로딩 중...`, 'busy');
  const firstNew = images.length;
  for (const f of files) {
    try {
      const img = await loadImage(f);
      const entry = {
        id: nextId++, name: f.name, img,
        rotation: 0, flipH: false, flipV: false,
        source: null, sel: null,
      };
      rebuildSource(entry);
      entry.sel = { x: 0, y: 0, w: entry.source.width, h: entry.source.height };
      images.push(entry);
    } catch (e) { console.error(e); }
  }
  renderList();
  if (currentIdx < 0 && images.length) selectImage(firstNew);
  else render();
  setStatus(`이미지 ${images.length}장`);
}

function rebuildSource(entry) {
  const { rotation, flipH, flipV, img } = entry;
  const sideways = rotation === 90 || rotation === 270;
  const w = sideways ? img.naturalHeight : img.naturalWidth;
  const h = sideways ? img.naturalWidth : img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.translate(w / 2, h / 2);
  cx.rotate(rotation * Math.PI / 180);
  cx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  cx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
  entry.source = c;
}

function renderList() {
  const list = $('image-list');
  $('image-count').textContent = `이미지 ${images.length}장`;
  if (!images.length) {
    list.className = 'empty';
    list.innerHTML = '이미지를 추가하세요';
    return;
  }
  list.className = '';
  list.innerHTML = '';
  images.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'item' + (i === currentIdx ? ' selected' : '');
    row.innerHTML = `
      <img src="${e.img.src}" alt="">
      <div class="item-name" title="${e.name}">${e.name}</div>
      <button class="item-del" title="삭제">✕</button>
    `;
    row.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('item-del')) return;
      selectImage(i);
    });
    row.querySelector('.item-del').addEventListener('click', () => {
      images.splice(i, 1);
      if (currentIdx === i) currentIdx = -1;
      else if (currentIdx > i) currentIdx--;
      if (currentIdx < 0 && images.length) currentIdx = 0;
      renderList();
      if (currentIdx >= 0) { fitToView(); render(); } else { clearView(); }
      setStatus(`이미지 ${images.length}장`);
    });
    list.appendChild(row);
  });
}

function selectImage(i) {
  currentIdx = i;
  renderList();
  fitToView();
  render();
  $('drop-hint').classList.add('hidden');
}

function resizeCanvas() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}

function fitToView() {
  const e = current();
  if (!e) return;
  const pad = 40;
  const sx = (canvas.width - pad) / e.source.width;
  const sy = (canvas.height - pad) / e.source.height;
  zoom = Math.min(sx, sy, 1);
  if (!isFinite(zoom) || zoom <= 0) zoom = 1;
  panX = (canvas.width - e.source.width * zoom) / 2;
  panY = (canvas.height - e.source.height * zoom) / 2;
  updateZoomLabel();
}

function updateZoomLabel() {
  $('zoom-label').textContent = `${Math.round(zoom * 100)}%`;
}

function clearView() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $('drop-hint').classList.remove('hidden');
}

function render() {
  const e = current();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!e) { $('drop-hint').classList.remove('hidden'); return; }
  $('drop-hint').classList.add('hidden');
  const src = e.source;
  ctx.imageSmoothingEnabled = zoom < 1;
  ctx.drawImage(src, panX, panY, src.width * zoom, src.height * zoom);
  drawSelection(e.sel);
  updateZoomLabel();
}

function drawSelection(sel) {
  const vx = panX + sel.x * zoom;
  const vy = panY + sel.y * zoom;
  const vw = sel.w * zoom;
  const vh = sel.h * zoom;

  // dim outside
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, canvas.width, vy);
  ctx.fillRect(0, vy + vh, canvas.width, canvas.height - (vy + vh));
  ctx.fillRect(0, vy, vx, vh);
  ctx.fillRect(vx + vw, vy, canvas.width - (vx + vw), vh);

  // border
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(vx + 0.5, vy + 0.5, vw, vh);

  // rule-of-thirds grid
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.setLineDash([4, 4]);
  for (let i = 1; i < 3; i++) {
    const gx = vx + (vw * i) / 3;
    const gy = vy + (vh * i) / 3;
    ctx.beginPath(); ctx.moveTo(gx, vy); ctx.lineTo(gx, vy + vh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx, gy); ctx.lineTo(vx + vw, gy); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 8 handles
  const pts = handlePoints(sel);
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#0e639c';
  ctx.lineWidth = 1;
  for (const key of Object.keys(pts)) {
    const [hx, hy] = pts[key];
    ctx.fillRect(hx - HANDLE_SIZE / 2, hy - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
    ctx.strokeRect(hx - HANDLE_SIZE / 2 + 0.5, hy - HANDLE_SIZE / 2 + 0.5, HANDLE_SIZE - 1, HANDLE_SIZE - 1);
  }
}

function handlePoints(sel) {
  const vx = panX + sel.x * zoom;
  const vy = panY + sel.y * zoom;
  const vw = sel.w * zoom;
  const vh = sel.h * zoom;
  return {
    nw: [vx, vy], n: [vx + vw / 2, vy], ne: [vx + vw, vy],
    w:  [vx, vy + vh / 2],               e: [vx + vw, vy + vh / 2],
    sw: [vx, vy + vh], s: [vx + vw / 2, vy + vh], se: [vx + vw, vy + vh],
  };
}

function hitTest(mx, my, sel) {
  const pts = handlePoints(sel);
  for (const key of Object.keys(pts)) {
    const [hx, hy] = pts[key];
    if (Math.abs(mx - hx) <= HANDLE_SIZE && Math.abs(my - hy) <= HANDLE_SIZE) return key;
  }
  const vx = panX + sel.x * zoom;
  const vy = panY + sel.y * zoom;
  const vw = sel.w * zoom;
  const vh = sel.h * zoom;
  if (mx >= vx && mx <= vx + vw && my >= vy && my <= vy + vh) return 'move';
  return 'pan';
}

function cursorFor(mode) {
  switch (mode) {
    case 'nw': case 'se': return 'nwse-resize';
    case 'ne': case 'sw': return 'nesw-resize';
    case 'n': case 's': return 'ns-resize';
    case 'e': case 'w': return 'ew-resize';
    case 'move': return 'move';
    case 'pan': return 'grab';
  }
  return 'default';
}

function resizeSel(e, handle, dx, dy, orig) {
  const sw = e.source.width, sh = e.source.height;
  let x = orig.x, y = orig.y, w = orig.w, h = orig.h;
  if (handle.includes('w')) {
    const nx = Math.max(0, Math.min(orig.x + orig.w - MIN_SEL, orig.x + dx));
    x = nx; w = orig.x + orig.w - nx;
  }
  if (handle.includes('e')) {
    const right = Math.min(sw, Math.max(orig.x + MIN_SEL, orig.x + orig.w + dx));
    w = right - x;
  }
  if (handle.includes('n')) {
    const ny = Math.max(0, Math.min(orig.y + orig.h - MIN_SEL, orig.y + dy));
    y = ny; h = orig.y + orig.h - ny;
  }
  if (handle.includes('s')) {
    const bottom = Math.min(sh, Math.max(orig.y + MIN_SEL, orig.y + orig.h + dy));
    h = bottom - y;
  }
  e.sel.x = Math.round(x);
  e.sel.y = Math.round(y);
  e.sel.w = Math.max(MIN_SEL, Math.round(w));
  e.sel.h = Math.max(MIN_SEL, Math.round(h));
}

// --- Mouse events ---
canvas.addEventListener('mousedown', (ev) => {
  const e = current();
  if (!e) return;
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const mode = hitTest(mx, my, e.sel);
  interact = {
    mode, startX: mx, startY: my,
    origSel: { ...e.sel },
    origPan: { x: panX, y: panY },
  };
  canvas.style.cursor = mode === 'pan' ? 'grabbing' : cursorFor(mode);
});

canvas.addEventListener('mousemove', (ev) => {
  const e = current();
  if (!e) return;
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  if (!interact) {
    const mode = hitTest(mx, my, e.sel);
    canvas.style.cursor = cursorFor(mode);
    return;
  }
  const dxView = mx - interact.startX;
  const dyView = my - interact.startY;
  if (interact.mode === 'pan') {
    panX = interact.origPan.x + dxView;
    panY = interact.origPan.y + dyView;
  } else if (interact.mode === 'move') {
    const dx = dxView / zoom;
    const dy = dyView / zoom;
    let nx = interact.origSel.x + dx;
    let ny = interact.origSel.y + dy;
    nx = Math.max(0, Math.min(e.source.width - e.sel.w, nx));
    ny = Math.max(0, Math.min(e.source.height - e.sel.h, ny));
    e.sel.x = Math.round(nx);
    e.sel.y = Math.round(ny);
  } else {
    resizeSel(e, interact.mode, dxView / zoom, dyView / zoom, interact.origSel);
  }
  render();
});

['mouseup', 'mouseleave'].forEach(ev => {
  canvas.addEventListener(ev, () => {
    if (interact) {
      interact = null;
      canvas.style.cursor = 'default';
    }
  });
});

canvas.addEventListener('wheel', (ev) => {
  if (!current()) return;
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  const newZoom = Math.max(0.05, Math.min(40, zoom * factor));
  panX = mx - (mx - panX) * (newZoom / zoom);
  panY = my - (my - panY) * (newZoom / zoom);
  zoom = newZoom;
  render();
}, { passive: false });

// --- Transforms ---
function applyRotation(delta) {
  const e = current();
  if (!e) return;
  const oldW = e.source.width, oldH = e.source.height;
  const s = { ...e.sel };
  // normalize delta to positive
  let d = ((delta % 360) + 360) % 360;
  let nx = s.x, ny = s.y, nw = s.w, nh = s.h;
  // rotate selection to match new image coords
  while (d > 0) {
    // CW 90°: (x,y,w,h) in (W,H) → (H - y - h, x, h, w) in (H,W)
    const tmpH = oldH, tmpW = oldW;
    const a = tmpH - ny - nh;
    const b = nx;
    const c2 = nh;
    const d2 = nw;
    nx = a; ny = b; nw = c2; nh = d2;
    d -= 90;
  }
  e.rotation = ((e.rotation + delta) % 360 + 360) % 360;
  rebuildSource(e);
  e.sel = { x: nx, y: ny, w: nw, h: nh };
  fitToView();
  render();
}

function applyFlipH() {
  const e = current();
  if (!e) return;
  const oldW = e.source.width;
  const s = e.sel;
  const newSel = { x: oldW - s.x - s.w, y: s.y, w: s.w, h: s.h };
  e.flipH = !e.flipH;
  rebuildSource(e);
  e.sel = newSel;
  render();
}

function applyFlipV() {
  const e = current();
  if (!e) return;
  const oldH = e.source.height;
  const s = e.sel;
  const newSel = { x: s.x, y: oldH - s.y - s.h, w: s.w, h: s.h };
  e.flipV = !e.flipV;
  rebuildSource(e);
  e.sel = newSel;
  render();
}

function selectAll() {
  const e = current();
  if (!e) return;
  e.sel = { x: 0, y: 0, w: e.source.width, h: e.source.height };
  render();
}

function zoomAtCenter(factor) {
  if (!current()) return;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const newZoom = Math.max(0.05, Math.min(40, zoom * factor));
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  render();
}

function saveCurrent() {
  const e = current();
  if (!e) { setStatus('저장할 이미지가 없습니다', 'error'); return; }
  const s = e.sel;
  if (s.w < 1 || s.h < 1) { setStatus('선택 영역이 너무 작습니다', 'error'); return; }
  const out = document.createElement('canvas');
  out.width = Math.round(s.w);
  out.height = Math.round(s.h);
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(e.source, Math.round(s.x), Math.round(s.y), out.width, out.height, 0, 0, out.width, out.height);
  out.toBlob((blob) => {
    if (!blob) { setStatus('저장 실패', 'error'); return; }
    const base = e.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${base}_cut.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(`저장됨: ${base}_cut.png`);
  }, 'image/png');
}

// --- Wiring ---
$('btn-load').onclick = () => $('file-input').click();
$('file-input').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('btn-rotate-cw').onclick = () => applyRotation(90);
$('btn-rotate-ccw').onclick = () => applyRotation(-90);
$('btn-flip-h').onclick = applyFlipH;
$('btn-flip-v').onclick = applyFlipV;
$('btn-zoom-in').onclick = () => zoomAtCenter(1.25);
$('btn-zoom-out').onclick = () => zoomAtCenter(1 / 1.25);
$('btn-fit').onclick = () => { fitToView(); render(); };
$('btn-select-all').onclick = selectAll;
$('btn-save').onclick = saveCurrent;

// Drag and drop
['dragenter', 'dragover'].forEach(ev => {
  document.body.addEventListener(ev, (e) => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      document.body.classList.add('dragover');
    }
  });
});
['dragleave', 'drop'].forEach(ev => {
  document.body.addEventListener(ev, (e) => {
    if (e.type === 'dragleave' && e.target !== document.body) return;
    document.body.classList.remove('dragover');
  });
});
document.body.addEventListener('drop', (e) => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  addFiles(e.dataTransfer.files);
});

window.addEventListener('resize', () => {
  resizeCanvas();
  if (currentIdx >= 0) { fitToView(); render(); }
});

resizeCanvas();
setStatus('준비됨');
</script>
</body>
</html>
